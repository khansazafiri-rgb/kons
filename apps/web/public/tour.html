<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>PCV Classroom — Cinematic Tour</title>
<style>
  :root{
    --alba-50:#FDFBF7;--alba-100:#F8F4EC;--alba-200:#EFE7D9;--alba-300:#E2D6C2;
    --maroon-50:#FBF1F0;--maroon-100:#F4DEDC;--maroon-200:#E6B8B4;--maroon-300:#D28A84;
    --maroon-400:#B54038;--maroon-500:#A11C13;--maroon-600:#8E0100;--maroon-700:#740100;
    --maroon-800:#5A0100;--maroon-900:#420000;
    --gold-100:#F7EFD8;--gold-200:#EBDCA8;--gold-400:#C9A227;--gold-600:#9A7B1C;
    --stone-400:#a8a29e;--stone-500:#78716c;--stone-600:#57534e;--stone-700:#44403c;--stone-800:#292524;
    --green-600:#16a34a;--green-50:#f0fdf4;--green-200:#bbf7d0;--green-900:#14532d;
    --ink:#F7F3EC;
    --serif:'Fraunces',Georgia,serif;
    --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --ez:cubic-bezier(.22,1,.36,1);
    --ezc:cubic-bezier(.62,0,.35,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);overflow:hidden;color:var(--stone-800);
    background:radial-gradient(130% 100% at 50% 30%,#3b3532 0%,#241f1e 45%,#2a0f0d 100%)}
  /* ===== zona: tagline atas / film tengah / kontrol bawah ===== */
  #tag{position:fixed;top:0;left:0;right:0;height:104px;z-index:70;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8px 24px 0}
  #tag .t{font-family:var(--serif);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;
    font-size:clamp(19px,3vw,34px);color:var(--ink);text-shadow:0 2px 22px rgba(0,0,0,.75)}
  #tag .s{margin-top:5px;color:var(--gold-200);font-size:clamp(11px,1.3vw,14px);font-weight:500}
  #tag.show .t{animation:tagIn .5s var(--ez)}
  #tag.show .s{animation:tagIn .5s .1s both var(--ez)}
  @keyframes tagIn{from{opacity:0;transform:translateY(20px);filter:blur(7px)}
    to{opacity:1;transform:none;filter:blur(0)}}
  #frame{position:fixed;top:104px;bottom:38px;left:0;right:0;overflow:hidden}
  #frame.shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}
    50%{transform:translate(-3px,2px)}75%{transform:translate(2px,2px)}}
  #wrap{position:absolute;inset:0;display:grid;place-items:center}
  #wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 95% at 50% 45%,transparent 40%,rgba(8,5,4,.55) 100%)}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #fxb{z-index:1}
  #fxf{z-index:60;pointer-events:none}
  #fit{transform-origin:center center;position:relative;z-index:8}
  #stage{perspective:1750px;perspective-origin:50% 42%}
  #camera{position:relative;transform-style:preserve-3d;transition:transform .85s var(--ezc)}
  /* ===== laptop ===== */
  #laptop{transform-style:preserve-3d;opacity:0;transition:opacity .5s ease}
  #laptop.on{opacity:1}
  #lid{background:#0b0a0a;border-radius:22px;padding:12px 12px 14px;
    box-shadow:0 45px 130px rgba(0,0,0,.7),inset 0 0 0 1px #2a2727}
  #cam-dot{width:6px;height:6px;border-radius:50%;background:#332f2f;margin:0 auto 6px}
  #viewport{position:relative;width:1040px;height:648px;border-radius:10px;overflow:hidden;
    background:var(--alba-50)}
  #base{width:1130px;height:16px;margin:-2px auto 0;border-radius:0 0 16px 16px;
    background:linear-gradient(#3a3535,#151212);position:relative;
    box-shadow:0 24px 40px rgba(0,0,0,.5)}
  #base::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:120px;height:7px;border-radius:0 0 9px 9px;background:#0b0a0a}
  /* ===== layar-layar (setia ke web asli) ===== */
  .screen{position:absolute;inset:0;opacity:0;pointer-events:none;
    transition:opacity .4s ease;display:flex;flex-direction:column;background:var(--alba-50);
    overflow:hidden}
  .screen.active{opacity:1}
  .logo{display:inline-flex;align-items:center;gap:9px}
  .logo img.mk{width:28px;height:28px;border-radius:8px;object-fit:cover;display:block}
  .logo .wd{font-family:var(--serif);font-weight:600;font-size:16px;color:var(--maroon-600)}
  .logo .wd b{color:var(--stone-800);font-weight:600}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--maroon-600);display:flex;align-items:center;gap:8px}
  .h1{font-family:var(--serif);font-weight:600;color:var(--stone-800)}
  svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.9;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .appbar{display:flex;align-items:center;justify-content:space-between;
    padding:10px 26px;border-bottom:1px solid var(--alba-200);
    background:rgba(253,251,247,.92)}
  .appbar .nav{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-left:26px}
  .appbar .nav span{padding:6px 12px;border-radius:99px;color:var(--stone-600)}
  .appbar .nav span.on{background:var(--maroon-600);color:var(--alba-50);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .appbar .right{display:flex;align-items:center;gap:10px}
  .chip-user{display:flex;align-items:center;gap:9px;border:1px solid var(--alba-200);
    background:rgba(248,244,236,.6);border-radius:99px;padding:5px 14px 5px 6px}
  .chip-user .av{width:26px;height:26px;border-radius:50%;background:var(--maroon-600);
    color:var(--alba-50);display:grid;place-items:center;font-size:12px;font-weight:700}
  .chip-user .nm{font-size:11px;font-weight:700;line-height:1.15}
  .chip-user .rl{font-size:8.5px;letter-spacing:.12em;color:var(--maroon-500);font-weight:600}
  .btn-out{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    border:1px solid var(--alba-300);color:var(--stone-600);border-radius:99px;padding:7px 13px}
  /* landing */
  .land-top{height:4px;background:var(--maroon-600)}
  .land-head{display:flex;align-items:center;justify-content:space-between;
    padding:13px 34px;border-bottom:1px solid var(--alba-200);background:rgba(253,251,247,.9)}
  .land-nav{display:flex;gap:20px;align-items:center;font-size:12.5px;font-weight:600;color:var(--stone-600)}
  .btn-mrn{display:inline-flex;align-items:center;gap:8px;background:var(--maroon-600);
    color:var(--alba-50);border-radius:99px;font-weight:600;box-shadow:0 2px 6px rgba(90,1,0,.25)}
  .land-head .btn-mrn{padding:9px 18px;font-size:12.5px}
  .land-body{flex:1;padding:0 44px;overflow:hidden}
  .land-scroll{transform:translateY(0);transition:transform 2.6s ease}
  .landing.play .land-scroll{transform:translateY(-190px)}
  .land-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:38px;align-items:center;padding-top:40px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
    letter-spacing:.2em;color:var(--maroon-600);background:var(--maroon-50);
    border:1px solid var(--maroon-100);border-radius:99px;padding:6px 14px;margin-bottom:16px}
  .land-grid h1{font-family:var(--serif);font-size:40px;line-height:1.1;font-weight:600}
  .land-grid h1 .m{color:var(--maroon-600);font-style:italic}
  .land-sub{margin-top:14px;color:var(--stone-600);font-size:15px;max-width:400px;line-height:1.55}
  .land-ctas{display:flex;align-items:center;gap:16px;margin-top:22px}
  .land-ctas .btn-mrn{padding:12px 24px;font-size:13.5px}
  .land-ctas .lnk{font-size:12.5px;font-weight:600;color:var(--maroon-600);
    text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--maroon-200)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px;max-width:360px}
  .stat{border:1px solid var(--alba-200);background:rgba(248,244,236,.6);border-radius:12px;
    padding:10px;text-align:center}
  .stat .v{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--maroon-600)}
  .stat .l{font-size:10px;font-weight:600;color:var(--stone-500);margin-top:2px}
  .focus-wrap{position:relative}
  .focus-wrap::before{content:"";position:absolute;top:-18px;left:-18px;width:86px;height:86px;
    border-radius:22px;background:var(--gold-100);border:1px solid var(--gold-200)}
  .focus{position:relative;border-radius:22px;padding:28px;color:var(--alba-50);
    background:radial-gradient(120% 130% at 20% 0%,var(--maroon-500),var(--maroon-700) 55%,var(--maroon-800));
    box-shadow:0 18px 40px rgba(0,0,0,.18)}
  .focus .k{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--alba-200);margin-bottom:14px}
  .focus li{display:flex;gap:10px;font-size:13px;line-height:1.5;margin-bottom:11px;list-style:none}
  .focus li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold-400);
    flex:none;margin-top:6px}
  .focus .ft{margin-top:16px;padding-top:14px;border-top:1px solid rgba(253,251,247,.15);
    display:flex;gap:9px;align-items:center;font-size:12px;color:var(--alba-200)}
  /* web siswa home */
  .home-body{padding:26px 44px;position:relative}
  .remind{margin-top:18px;border:1px solid var(--maroon-200);background:rgba(251,241,240,.6);
    border-radius:16px;padding:14px 18px}
  .remind .rt{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--maroon-600);margin-bottom:9px}
  .remind .card{display:inline-flex;align-items:center;gap:12px;background:var(--alba-50);
    border:1px solid var(--maroon-100);border-radius:12px;padding:9px 16px}
  .remind .en{font-family:var(--serif);font-weight:600;font-size:13px}
  .remind .ed{font-size:10.5px;color:var(--stone-500)}
  .remind .dd{border-left:1px solid var(--maroon-100);padding-left:12px;text-align:right}
  .remind .dv{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--maroon-600);line-height:1}
  .remind .dl{font-size:8.5px;letter-spacing:.1em;color:var(--stone-400);font-weight:600;text-transform:uppercase}
  .home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
  .hc{position:relative;display:flex;flex-direction:column;border:1px solid var(--alba-200);
    background:var(--alba-50);border-radius:16px;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.06);transition:transform .55s var(--ez),box-shadow .55s}
  .hc .top{height:5px;background:var(--maroon-600)}
  .hc .in{padding:19px;display:flex;flex-direction:column;flex:1}
  .hc .ico{width:40px;height:40px;border-radius:11px;background:var(--maroon-50);
    border:1px solid var(--maroon-100);color:var(--maroon-600);display:grid;place-items:center;
    font-size:18px;margin-bottom:13px;transition:.4s}
  .hc h2{font-family:var(--serif);font-size:16.5px;font-weight:600}
  .hc p{font-size:12px;color:var(--stone-600);line-height:1.55;margin-top:5px;flex:1}
  .hc .go{margin-top:14px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
    background:var(--maroon-600);color:var(--alba-50);border-radius:99px;padding:8px 18px;
    font-size:11.5px;font-weight:700}
  @keyframes riseIn{from{opacity:0;transform:translateY(26px)}70%{opacity:1;transform:translateY(-5px)}
    to{opacity:1;transform:none}}
  .studentHome.enter .hc{opacity:0;animation:riseIn .45s var(--ez) forwards}
  .studentHome.enter .hc:nth-child(1){animation-delay:.05s}
  .studentHome.enter .hc:nth-child(2){animation-delay:.2s}
  .studentHome.enter .hc:nth-child(3){animation-delay:.35s}
  .dim-layer{position:absolute;inset:0;background:#0b0a0a;opacity:0;pointer-events:none;
    transition:opacity .5s ease;z-index:5}
  .studentHome.dim .dim-layer{opacity:.45}
  .studentHome.pop-perdalam .hc.perdalam,
  .studentHome.fly-cicil .hc.cicil{z-index:20;transform:scale(1.1) translateY(-10px);
    box-shadow:0 30px 60px rgba(90,1,0,.4)}
  .studentHome.pop-perdalam .hc.perdalam .ico,
  .studentHome.fly-cicil .hc.cicil .ico{background:var(--maroon-600);color:var(--alba-50)}
  @keyframes flyIn{from{transform:translateX(560px) scale(.8);opacity:0}
    to{transform:scale(1.1) translateY(-10px);opacity:1}}
  .studentHome.fly-cicil .hc.cicil{animation:flyIn .8s var(--ez)}
  /* picker */
  .pk{max-width:620px;margin:0 auto;padding:22px 24px 0;width:100%}
  .pk-card{margin-top:16px;border:1px solid var(--alba-200);background:var(--alba-50);
    border-radius:16px;padding:20px;box-shadow:0 8px 22px rgba(0,0,0,.05)}
  .lbl{font-size:12.5px;font-weight:700;color:var(--stone-700);margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .subj{border:1px solid var(--alba-200);border-radius:12px;padding:11px 13px;transition:.3s;text-align:left}
  .subj .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .subj .nm{font-size:12.5px;font-weight:700;color:var(--stone-700)}
  .subj .ct{font-size:10px;font-weight:700;color:var(--maroon-500)}
  .subj .pb{height:5px;border-radius:99px;background:var(--alba-200);overflow:hidden}
  .subj .pb i{display:block;height:100%;background:var(--maroon-600);border-radius:99px}
  .subj.sel{border-color:var(--maroon-600);background:var(--maroon-50)}
  .subj.sel .nm{color:var(--maroon-700)}
  .reveal2{max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ez),opacity .4s}
  .picker .reveal2.on{max-height:340px;opacity:1}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--alba-300);
    background:var(--alba-50);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--stone-400);margin:15px 0 9px}
  .chaps{display:grid;gap:7px}
  .chap{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--alba-200);
    border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:500;color:var(--stone-700);transition:.25s}
  .chap.done svg{color:var(--maroon-400)}
  .chap.sel{border-color:var(--maroon-600);background:var(--maroon-50);color:var(--maroon-700);font-weight:600}
  .btn-start{margin-top:16px;width:100%;border-radius:12px;background:var(--maroon-600);
    color:var(--alba-50);font-weight:700;font-size:13.5px;text-align:center;padding:12px;
    box-shadow:0 6px 16px rgba(90,1,0,.25)}
  /* ppt */
  .ppt-wrap{max-width:760px;margin:0 auto;width:100%;padding:18px 24px 0}
  .backlnk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--stone-500)}
  .ppt-wrap h1{font-family:var(--serif);font-size:22px;font-weight:600;margin:8px 0 14px}
  .ppt-card{border:1px solid var(--alba-200);border-radius:16px;overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.05);background:var(--alba-50)}
  .gold-note{display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:rgba(247,239,216,.6);border-bottom:1px solid var(--gold-200);padding:9px 14px}
  .gold-note p{font-size:11px;color:var(--stone-700);font-weight:500}
  .gold-note .gb{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--gold-400);
    color:var(--alba-50);font-weight:700;font-size:11px;border-radius:9px;padding:7px 12px}
  .viewer{position:relative;height:330px;background:#fff;overflow:hidden}
  .ppt-scroll{position:absolute;left:50%;transform:translate(-50%,0);width:86%;padding:18px 0;
    display:grid;gap:14px;transition:transform 1.6s linear}
  .ppt.play .ppt-scroll{transform:translate(-50%,-215px)}
  .slide{border:1px solid #e5e0d5;background:var(--alba-50);border-radius:10px;padding:20px 24px;
    box-shadow:0 4px 14px rgba(0,0,0,.05)}
  .slide-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .tag-hy{background:var(--maroon-50);color:var(--maroon-600);border-radius:99px;padding:3px 10px;
    font-size:9.5px;font-weight:700}
  .slide h2{font-family:var(--serif);font-size:17px;font-weight:600}
  .slide-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:10px}
  .slide ul{list-style:none;display:grid;gap:6px;font-size:11px;color:var(--stone-600)}
  .slide li::before{content:"•";color:var(--maroon-400);margin-right:7px}
  .diagram{display:grid;place-items:center;border-radius:8px;background:var(--maroon-50);
    color:var(--maroon-300);font-size:38px}
  .ppt-done{margin:14px auto 0;display:block;width:fit-content;border-radius:12px;
    background:var(--maroon-600);color:var(--alba-50);font-weight:700;font-size:12.5px;padding:11px 26px}
  /* question runner */
  .run{max-width:660px;margin:0 auto;width:100%;padding:20px 24px 0}
  .run-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .run-top .md{font-size:11.5px;font-weight:700;color:var(--maroon-600);
    background:var(--maroon-50);border:1px solid var(--maroon-100);border-radius:99px;padding:5px 13px}
  .run-top .ex{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--stone-500)}
  .run-pb{height:5px;border-radius:99px;background:var(--alba-200);overflow:hidden}
  .run-pb i{display:block;height:100%;background:var(--maroon-600);border-radius:99px;transition:width .4s var(--ez)}
  .run-pbt{font-size:10px;font-weight:600;color:var(--stone-400);margin:5px 0 14px}
  .qtext{font-size:16px;font-weight:500;color:var(--stone-800);line-height:1.5;margin-bottom:14px}
  .opts{display:grid;gap:9px}
  .opt2{display:flex;gap:11px;align-items:flex-start;border:2px solid var(--alba-300);
    border-radius:12px;padding:10px 13px;transition:.25s;background:var(--alba-50)}
  .opt2 .lt{width:23px;height:23px;flex:none;border-radius:50%;border:1px solid var(--alba-300);
    display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--stone-500);transition:.25s}
  .opt2 .tx{font-size:13px;font-weight:500;padding-top:2px;line-height:1.45}
  .opt2.good{border-color:var(--green-600);background:var(--green-50);box-shadow:0 2px 8px rgba(22,163,74,.12)}
  .opt2.good .lt{background:var(--green-600);border-color:var(--green-600);color:#fff}
  .opt2.pick{border-color:var(--maroon-600);background:var(--maroon-50)}
  .opt2.pick .lt{background:var(--maroon-600);border-color:var(--maroon-600);color:var(--alba-50)}
  .expl{margin:2px 0 0 34px;border:1px solid var(--green-200);background:var(--green-50);
    color:var(--green-900);border-radius:12px;padding:0 13px;font-size:11.5px;line-height:1.5;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--ez),opacity .3s,padding .3s}
  .expl.on{max-height:90px;opacity:1;padding-top:9px;padding-bottom:9px}
  .expl b{display:block;margin-bottom:2px}
  .img-q{display:grid;place-items:center;margin-bottom:14px}
  .img-q .ph{border:1px solid var(--alba-200);border-radius:12px;background:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.06);padding:10px 26px}
  .isian{border:1px solid var(--alba-200);background:rgba(248,244,236,.6);border-radius:12px;padding:13px}
  .isian .ql{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--stone-700);margin-bottom:9px}
  .isian .ql .b{width:22px;height:22px;border-radius:50%;background:var(--maroon-600);color:var(--alba-50);
    display:grid;place-items:center;font-size:10.5px;font-weight:700}
  .isian .inp{width:100%;border:1px solid var(--alba-300);border-radius:12px;background:var(--alba-50);
    padding:10px 13px;font-size:12.5px;color:var(--stone-800);transition:.25s}
  .isian .inp .caret{display:inline-block;width:1px;height:13px;background:var(--stone-700);
    vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:1px}
  @keyframes blink{50%{opacity:0}}
  .isian .inp.empty{color:var(--stone-400)}

/* ============ AUDIO: musik ceria 124 BPM + SFX ============ */
let AC=null,muteG=null,musG=null,sfxG=null,muted=false,seqTimer=null,step=0,nextT=0,mode='intro';
const STEP=60/BPM/4;
const PROG=[[130.81,164.81,196.00],[98.00,123.47,146.83],[110.00,130.81,164.81],[87.31,110.00,130.81]];
function audioInit(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  muteG=AC.createGain();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;
  muteG.connect(comp);comp.connect(AC.destination);
  musG=AC.createGain();musG.gain.value=.85;musG.connect(muteG);
  sfxG=AC.createGain();sfxG.gain.value=1;sfxG.connect(muteG);
  seqStart();
}
function eg(g,t,a,p,d){g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(p,t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function osc(fr,t,dur,p,type,dest,slide){const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(fr,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  eg(g,t,.006,p,dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.1);}
function nz(t,dur,p,f1,f2,type,dest){const len=Math.max(1,AC.sampleRate*dur),
  buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type=type||'bandpass';f.Q.value=1;
  f.frequency.setValueAtTime(f1,t);
  if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain();eg(g,t,.01,p,dur);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);}
const kick=t=>osc(150,t,.13,.48,'sine',musG,42);
const clap=t=>{nz(t,.05,.26,1600,null,'bandpass',musG);nz(t+.012,.05,.18,1900,null,'bandpass',musG);};
const hat=(t,p)=>nz(t,.03,p||.08,7000,null,'highpass',musG);
const bassN=(t,f)=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=480;
  eg(g,t,.01,.2,.17);o.connect(fl);fl.connect(g);g.connect(musG);o.start(t);o.stop(t+.25);};
const pluck=(t,f,p)=>{const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type='triangle';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=2600;
  eg(g,t,.005,p||.13,.13);o.connect(fl);fl.connect(g);g.connect(musG);o.start(t);o.stop(t+.2);};
const bell=(t,f,p)=>{osc(f,t,.5,p||.09,'sine',musG);osc(f*2.01,t,.3,(p||.09)*.4,'sine',musG);};
const pad=(t,fs,dur)=>fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain(),
  fl=AC.createBiquadFilter();o.type='triangle';o.frequency.value=f;
  fl.type='lowpass';fl.frequency.value=900;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.04,t+.5);
  g.gain.setValueAtTime(.04,t+dur-.5);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(fl);fl.connect(g);g.connect(musG);o.start(t);o.stop(t+dur+.1);});
function seqStart(){
  step=0;nextT=AC.currentTime+.1;
  seqTimer=setInterval(()=>{
    while(nextT<AC.currentTime+.14){schedStep(step,nextT);step++;nextT+=STEP;}
  },40);
}
function schedStep(s,t){
  const st=s%16,bar=Math.floor(s/16),ch=PROG[bar%4];
  if(mode==='intro'){if(st===0)pad(t,ch,STEP*16+.4);
    if(st%4===0)bell(t,ch[(st/4)%3]*4,.05);return;}
  if(mode==='outro'){if(st===0){kick(t);clap(t);bell(t,523.25,.15);bell(t+.15,659.25,.12);pad(t,PROG[3],2.4);}return;}
  const build=mode==='build',drop=mode==='drop';
  if(st%4===0)kick(t);
  if(st===4||st===12)clap(t);
  if(build?true:st%2===0)hat(t,build?.1:.08);
  if(st%4===2)bassN(t,ch[0]/2);
  if(drop&&st%8===6)bassN(t,ch[2]/2);
  const arp=[0,1,2,1];
  if(st%2===0)pluck(t,ch[arp[(st/2)%4]]*2,drop?.15:.11);
  if(st===0)bell(t,ch[0]*4,drop?.12:.07);
  if(drop&&st===8)bell(t,ch[1]*4,.1);
}
const FXS={
  whooshIn(){nz(AC.currentTime,.4,.16,300,2400);},
  whooshOut(){nz(AC.currentTime,.45,.16,2200,260);},
  click(){osc(1300,AC.currentTime,.05,.13,'triangle');nz(AC.currentTime,.02,.07,3200,null,'highpass');},
  tick(){osc(1900,AC.currentTime,.02,.05,'sine');},
  tock(){nz(AC.currentTime,.035,.08,1150);},
  type(){nz(AC.currentTime,.025,.07,2400,null,'highpass');},
  paper(){nz(AC.currentTime,.35,.09,900,1900);},
  pop(){nz(AC.currentTime,.05,.18,900);},
  ding(){[880,1174.7,1760].forEach((f,k)=>osc(f,AC.currentTime+k*.09,.6,.12,'sine'));},
  chime(){[1046.5,1318.5,1568].forEach((f,k)=>osc(f,AC.currentTime+k*.07,.7,.11,'sine'));},
  riser(){nz(AC.currentTime,.85,.15,240,3400);osc(180,AC.currentTime,.85,.06,'sawtooth',sfxG,650);},
  boom(){osc(120,AC.currentTime,.5,.45,'sine',sfxG,36);nz(AC.currentTime,.28,.28,180,60,'lowpass');},
  heart(){osc(120,AC.currentTime,.14,.35,'sine',sfxG,46);},
  shimmer(){[1568,1976,2637,3136].forEach((f,k)=>osc(f,AC.currentTime+k*.12,1,.045,'sine'));},
  alarm(){osc(660,AC.currentTime,.15,.08,'square');
    osc(494,AC.currentTime+.18,.16,.08,'square');},
};
const sfx=n=>{if(AC&&!muted)try{FXS[n]()}catch(e){}};

/* ============ canvas fx: debu + confetti kanvas ============ */
const fxb=$('#fxb'),fxf=$('#fxf');
let W=0,H=0;
function sizes(){const fr=$('#frame');W=fr.clientWidth;H=fr.clientHeight;
  [fxb,fxf].forEach(c=>{c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;
    c.getContext('2d').setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);});
  // ukuran overlay dipaksa lewat px (unit vw/vh terbukti tidak stabil di host tertentu)
  ['#intro','#finale','#gate'].forEach(s=>{const e=$(s);
    e.style.width=window.innerWidth+'px';e.style.height=window.innerHeight+'px';});}
addEventListener('resize',sizes);sizes();
const bctx=fxb.getContext('2d'),fctx=fxf.getContext('2d');
let dust=[],ribbons=[];
for(let i=0;i<36;i++)dust.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,
  vy:-.00005-Math.random()*.0001,a:.1+Math.random()*.2});
const RC=['#C9A227','#2EC4B6','#FF6B6B','#7C3AED'];
function ribbonSweep(dir,big){
  if(big){ // gelombang besar seperti ombak menyapu layar
    const CC=RC.concat(['#8E0100','#EBDCA8','#2EC4B6']);
    CC.forEach((c,k)=>ribbons.push({c,t:0,dur:.85+k*.06,
      amp:80+k*22,ph:k*1.3,w:95+k*30,dir,y0:H*((k+.6)/(CC.length+.4))}));
  }else{
    RC.forEach((c,k)=>ribbons.push({c,t:0,dur:.6+k*.06,
      amp:36+k*24,ph:k*1.7,w:20+k*6,dir,y0:H*(.28+k*.14)}));
  }
}
let lastF=0;
function drawFx(ts){requestAnimationFrame(drawFx);
  const dt=Math.min((ts-lastF)/1000,.05);lastF=ts;
  bctx.clearRect(0,0,W,H);bctx.fillStyle='#F7F3EC';
  dust.forEach(p=>{p.y+=p.vy*H*dt*60;if(p.y<-.02){p.y=1.02;p.x=Math.random();}
    bctx.globalAlpha=p.a;bctx.beginPath();bctx.arc(p.x*W,p.y*H,p.r,0,6.283);bctx.fill();});
  bctx.globalAlpha=1;
  fctx.clearRect(0,0,W,H);
  ribbons=ribbons.filter(r=>r.t<1);
  ribbons.forEach(r=>{r.t+=dt/r.dur;
    const e=Math.min(Math.max(r.t,0),1), eh=e*e*(3-2*e); // smoothstep: kepala ombak melaju halus
    const head=(r.dir>0?-0.25+eh*1.5:1.25-eh*1.5);
    fctx.strokeStyle=r.c;fctx.lineWidth=r.w;
    fctx.lineCap='round';fctx.lineJoin='round';
    fctx.globalAlpha=Math.min(1,(1-e)*1.8);fctx.beginPath();
    const N=44;
    for(let i=0;i<=N;i++){const p=i/N,x=(head-p*.4*r.dir)*W;
      const y=r.y0+Math.sin(p*2.3+r.ph+e*2.2)*r.amp;
      i?fctx.lineTo(x,y):fctx.moveTo(x,y);}
    fctx.stroke();});
  fctx.globalAlpha=1;}
requestAnimationFrame(drawFx);

const TOTAL=B.reduce((a,b)=>a+b.d,0);

/* ---------- helper timeline ---------- */
let idx=0,mainT=null,subT=[],ivs=[],rafs=[],examIv=null,lastScreen=null,paused=false,started=false;
function sched(fn,ms){const t=setTimeout(fn,ms);subT.push(t);return t;}
function clearAll(){clearTimeout(mainT);subT.forEach(clearTimeout);subT=[];
  ivs.forEach(clearInterval);ivs=[];rafs.forEach(cancelAnimationFrame);rafs=[];
  clearInterval(examIv);examIv=null;}
function camSet(s,x,y,rx,ry){
  cam.style.transform=`translate(${x}px,${y}px) scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg)`;}
function show(id,variant){
  const scr=byId(id);
  if(lastScreen!==id){screens.forEach(s=>s.classList.remove('active'));scr.classList.add('active');}
  if(id==='studentHome'){scr.className='screen studentHome active '+(variant||'');}
  else if(variant){scr.classList.remove(variant);void scr.offsetWidth;scr.classList.add(variant);}
  lastScreen=id;return scr;}
function acts(list){
  const scr=byId(lastScreen);cursor.style.opacity=1;
  const d=B[idx].d;
  list.forEach(a=>{
    const tC=d*a.at,tM=Math.max(0,tC-430);
    sched(()=>{const p=posOf(scr,a.sel,a.dx,a.dy);if(p)cursorTo(p,400);},tM);
    sched(()=>{const p=posOf(scr,a.sel,a.dx,a.dy);if(!p)return;
      if(a.click)ripple(p);
      if(a.fx&&FX[a.fx])FX[a.fx](scr);},tC);
  });
}
const CONF=['#8E0100','#C9A227','#B54038','#EBDCA8','#16a34a'];
function confetti(scr){for(let i=0;i<24;i++){const s=document.createElement('span');
  s.className='confetti';s.style.left=(8+Math.random()*84)+'%';
  s.style.background=CONF[i%CONF.length];
  s.style.animationDuration=(1.2+Math.random()*1)+'s';
  s.style.animationDelay=(Math.random()*.25)+'s';
  s.style.transform=`rotate(${Math.random()*360}deg)`;
  scr.appendChild(s);setTimeout(()=>s.remove(),2600);}
  sfx('pop');setTimeout(()=>sfx('pop'),130);}
function shakeFrame(){const f=$('#frame');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');}
function countUp(scr,target,ms){
  const el=scr.querySelector('.num');el.textContent='0';
  const t0=performance.now();let lastTick=0;
  const tk=t=>{const p=Math.min((t-t0)/ms,1);el.textContent=Math.round(p*target);
    if(t-lastTick>80&&p<1){sfx('tick');lastTick=t;}
    if(p<1)rafs.push(requestAnimationFrame(tk));
    else{sfx('chime');shakeFrame();confetti(scr);}};
  rafs.push(requestAnimationFrame(tk));}
function runExam(scr){
  const tval=scr.querySelector('.tval'),tm=scr.querySelector('.timer');
  let sec=58,bt=0;
  scr.querySelector('.opt2[data-o="1"]').classList.remove('pick');
  examIv=setInterval(()=>{sec=Math.max(0,sec-3);bt++;
    tval.textContent='00:'+String(sec).padStart(2,'0');
    const low=sec<=25;tm.classList.toggle('low',low);
    if(bt%2===0)sfx('tock');if(low&&bt%3===0)sfx('heart');},140);}
function resetScreens(){
  screens.forEach(s=>{
    s.querySelectorAll('.sel,.good,.pick').forEach(e=>e.classList.remove('sel','good','pick'));
    s.querySelectorAll('.reveal2.on,.expl.on,.res.on').forEach(e=>e.classList.remove('on'));
    const inp=s.querySelector('.inp');
    if(inp){inp.className='inp empty';
      const ty=s.querySelector('.typed');if(ty)ty.textContent='Ketik jawabanmu di sini...';}
  });
  const q1=byId('quiz1');q1.querySelector('.pbar').style.width='0%';
  q1.querySelector('.pbtx').textContent='0 dari 2 soal terjawab';
  const ex=byId('cbtExam');ex.querySelector('.pbar').style.width='30%';
  ex.querySelector('.pbtx').textContent='6 dari 20 soal terjawab';
  byId('landing').classList.remove('play');
  cursor.style.opacity=0;
}
function enter(i){
  clearAll();idx=i;
  if(i===0)resetScreens();
  if(!B[i].run.toString().includes('acts('))cursor.style.opacity=0;
  B[i].run();
  updateProg(i);
  if(!paused)mainT=setTimeout(()=>enter((i+1)%B.length),B[i].d);
}
function updateProg(i){
  const done=B.slice(0,i+1).reduce((a,b)=>a+b.d,0);
  $('#progbar').style.width=(done/TOTAL*100)+'%';}
function fit(){const fr=$('#frame');
  const f=Math.min(fr.clientWidth/1180,fr.clientHeight/760);
  $('#fit').style.transform=`scale(${Math.min(f,1)})`;}
addEventListener('resize',fit);

/* ---------- kontrol ---------- */
$('#start').onclick=()=>{audioInit();$('#gate').classList.add('off');
  sizes();fit();started=true;enter(0);};
const ppBtn=$('#pp');
ppBtn.onclick=()=>{if(!started)return;paused=!paused;
  ppBtn.textContent=paused?'▶ Play':'❚❚ Pause';
  if(paused){clearAll();if(AC)AC.suspend();clearInterval(seqTimer);seqTimer=null;}
  else{if(AC){AC.resume();if(!seqTimer)seqStart();}enter(idx);}};
$('#mute').onclick=()=>{muted=!muted;
  if(muteG)muteG.gain.value=muted?0:1;
  $('#mute').textContent=muted?'🔇 Bisu':'🔊 Musik';};
$('#rs').onclick=()=>{if(!started)return;paused=false;
  ppBtn.textContent='❚❚ Pause';if(AC)AC.resume();enter(0);};
</script>


<script>
/* ==== Kendali dari halaman induk (Student Web page) ====
   - {pcvTour:'play'}  : mulai otomatis TANPA suara (kebijakan autoplay browser)
   - {pcvTour:'pause'} : jeda saat panel keluar dari layar
   - {pcvTour:'resume'}: lanjut saat panel terlihat lagi
   Tombol musik tetap bisa menyalakan suara (klik = gesture sah). */
(function(){
  var mb=document.querySelector('#mute');
  var oldMute=mb.onclick;
  mb.onclick=function(){ if(typeof AC!=='undefined'&&AC&&AC.state==='suspended'){AC.resume();} oldMute(); };
  function autoStart(){
    if(started)return;
    try{audioInit();}catch(e){}
    muted=true; if(typeof muteG!=='undefined'&&muteG)muteG.gain.value=0;
    mb.textContent='\uD83D\uDD07 Bisu';
    document.querySelector('#gate').classList.add('off');
    sizes();fit();started=true;enter(0);
  }
  addEventListener('message',function(ev){
    var m=ev.data&&ev.data.pcvTour; if(!m)return;
    var pp=document.querySelector('#pp');
    if(m==='play'){ if(!started)autoStart(); else if(paused)pp.onclick(); }
    else if(m==='pause'){ if(started&&!paused)pp.onclick(); }
    else if(m==='resume'){ if(started&&paused)pp.onclick(); }
  });
})();
</script>
